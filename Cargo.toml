[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/chess", "crates/tensor", "crates/engine", "crates/plot"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = []
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = "warn"

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1"
